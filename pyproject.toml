[project]
name = "static-dynamic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.14.0"
dependencies = [
    "accelerate>=1.13.0",
    "einops>=0.8.2",
    "h5py>=3.15.1",
    "huggingface-hub<1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "lab>=8.10",
    "matplotlib>=3.10.8",
    "mpi4py>=4.1.1",
    "notebook>=7.1.3",
    "numba>=0.64.0",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "timm>=1.0.24",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers<5",
    "umap-learn>=0.5.12",
    "yt-dlp>=2026.6.9",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
